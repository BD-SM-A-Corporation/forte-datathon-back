x-backend: &backend
  build:
    context: .
    target: backend
    args:
      INSTALL_MODEL: ${INSTALL_MODEL:-true}
  image: forte-analysis:local
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env}
  environment:
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /app/storage/uploads
    RULES_PATH: /app/rules/regulations.json
    QWEN_MODEL_PATH: /models/Qwen2.5-VL-3B-Instruct
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
  volumes:
    - uploads:/app/storage
    - ${MODEL_WEIGHTS_DIR:-./weights}:/models:ro
    - ./rules:/app/rules:ro
  depends_on:
    redis:
      condition: service_healthy

services:
  model-init:
    build:
      context: .
      target: model-init
    image: forte-model-init:local
    restart: "no"
    environment:
      QWEN_MODEL_PATH: /models/Qwen2.5-VL-3B-Instruct
      QWEN_MODEL_REVISION: ${QWEN_MODEL_REVISION:-66285546d2b821cf421d4f5eb2576359d3770cd3}
      MODEL_INIT_OFFLINE: ${MODEL_INIT_OFFLINE:-0}
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HF_HOME: /models/.hf-cache
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    volumes:
      - ${MODEL_WEIGHTS_DIR:-./weights}:/models
  api:
    <<: *backend
    ports:
      - "8000:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *backend
    command: [python, -m, app.workers.analysis]
    depends_on:
      redis:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    stop_grace_period: 310s
    healthcheck:
      test: [CMD, python, -m, app.workers.health]
      interval: 30s
      timeout: 5s
      retries: 3
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: [redis-server, --appendonly, "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
  # This repository contains no frontend. Supply your existing Next.js image to opt in.
  frontend:
    profiles: [frontend]
    image: ${FRONTEND_IMAGE:-forte-frontend:local}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads:
  redis-data:
