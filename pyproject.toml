[project]
name = "forte-datathon-backend"
version = "0.1.0"
description = "FastAPI backend & ML video analytics pipeline for cash desk compliance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "opencv-python-headless>=4.9.0.80",
    "ultralytics>=8.1.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "redis>=5.0.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0"
]
