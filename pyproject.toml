[project]
name = "forte-datathon-backend"
version = "0.2.0"
description = "Offline CCTV observation and verified rule matching"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.18", "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3", "pillow>=10.4,<13", "aiofiles>=24.1,<26",
  "redis>=5,<7", "rq>=2.2,<3", "httpx>=0.27,<1"
]
[project.optional-dependencies]
model = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.51.3,<5", "accelerate>=1.2,<2"]
quantization = ["bitsandbytes>=0.45,<1"]
test = ["pytest>=8,<10", "fakeredis>=2.26,<3", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
